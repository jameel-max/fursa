services:
  - type: web
    name: fursa
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_PATH
        value: data/app.db
      - key: UPLOAD_DIR
        value: server/uploads
      - key: CLIENT_URL
        value: https://fursa.onrender.com
      - key: ADMIN_PHONE
        value: "0790000000"
      - key: ADMIN_PASSWORD
        value: Admin1234
